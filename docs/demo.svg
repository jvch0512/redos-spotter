<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of redos-spotter on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">redos-spotter</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>./bin/redos-spotter examples/patterns.txt</text><text class="r d0 " x="20" y="108" xml:space="preserve">14 patterns, 6 clean, 8 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">HIGH REDOS001 line 2: (a+)+$</text><text class="r d2 " x="20" y="152" xml:space="preserve">          nested quantifiers: the same text can be split between iterations in many ways (confirmed: 204</text><text class="r d3 h" x="20" y="174" xml:space="preserve">HIGH REDOS001 line 3: ^(([a-z])+.)+[A-Z]([a-z])+$</text><text class="r d4 " x="20" y="196" xml:space="preserve">          nested quantifiers: the same text can be split between iterations in many ways (confirmed: 463</text><text class="r d5 h" x="20" y="218" xml:space="preserve">HIGH REDOS001 line 4: ([a-zA-Z]+\s?)*$</text><text class="r d6 " x="20" y="240" xml:space="preserve">          nested quantifiers: the same text can be split between iterations in many ways (confirmed: 307</text><text class="r d7 h" x="20" y="262" xml:space="preserve">HIGH REDOS002 line 5: (\w|\d)+@</text><text class="r d8 " x="20" y="284" xml:space="preserve">          alternation inside a loop with overlapping branches (confirmed: 6140 steps on 10 chars, &gt;20000</text><text class="r d9 h" x="20" y="306" xml:space="preserve">HIGH REDOS002 line 6: (a|a)*b</text><text class="r d10 " x="20" y="328" xml:space="preserve">          alternation inside a loop with overlapping branches (confirmed: 6141 steps on 10 chars, &gt;20000</text><text class="r d11 h" x="20" y="350" xml:space="preserve">HIGH REDOS003 line 8: \d+\d+\d+x</text><text class="r d12 " x="20" y="372" xml:space="preserve">          3 adjacent loops over overlapping characters: cubic time on failing input (confirmed: 9051 ste</text><text class="r d13 m" x="20" y="394" xml:space="preserve">MEDIUM REDOS003 line 7: .*.*=.*</text><text class="r d14 " x="20" y="416" xml:space="preserve">          2 adjacent loops over overlapping characters: quadratic time on failing input (confirmed: 1023</text><text class="r d15 i" x="20" y="438" xml:space="preserve">INFO REDOS000 line 17: (a)\1+</text></svg>
